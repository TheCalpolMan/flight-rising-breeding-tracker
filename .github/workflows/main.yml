name: Windows Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  windows-build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install Qt
      # Installs the Qt SDK
      uses: jurplel/install-qt-action@v4
      with:
        # Version of Qt to install
        version: 6.9.3
        host: 'windows'
        arch: win64_msvc2022_64
        install-deps: true

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DTRACY_ENABLE=OFF

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}
    
    - name: Copy Assets
      run: xcopy ${{github.workspace}}\build\assets ${{github.workspace}}\build\${{env.BUILD_TYPE}}\assets /e /i
      
    - name: Deploy QT
      run: ${{env.QT_ROOT_DIR}}/bin/windeployqt.exe ${{github.workspace}}/build/${{env.BUILD_TYPE}}/flight-rising-breeding-tracker.exe
      
    - name: Publish
      uses: actions/upload-artifact@v7
      with:
        name: windows-x64
        path: ${{github.workspace}}/build/${{env.BUILD_TYPE}}
